name: Build Unsigned iOS IPA for SibApp

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Select newest Xcode (Swift 6.2+ required for Expo SDK 57)
        run: |
          ruby -e '
            apps = Dir.glob("/Applications/Xcode*.app")
            puts "=== Available Xcodes ==="
            puts apps
            stable = apps.reject { |a| a.downcase.include?("beta") }
            candidates = stable.empty? ? apps : stable
            best = candidates.max_by do |a|
              m = a.match(/Xcode_(\d+(?:\.\d+)*)/)
              m ? m[1].split(".").map(&:to_i) : [0]
            end
            abort("No Xcode found!") unless best
            puts "=== Selected Xcode: #{best} ==="
            File.write("/tmp/selected_xcode.txt", "#{best}/Contents/Developer")
          '
          DEV_DIR=$(cat /tmp/selected_xcode.txt)
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

          SWIFT_VER=$(swift --version | grep -oE 'Swift version [0-9]+\.[0-9]+' | awk '{print $3}')
          echo "Detected Swift: $SWIFT_VER"
          ruby -e 'exit(Gem::Version.new(ARGV[0]) >= Gem::Version.new("6.2") ? 0 : 1)' "$SWIFT_VER" || {
            echo "❌ Swift 6.2+ is not available on this runner. Switch runs-on to macos-26."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Disable code signing in Xcode project and Podfile
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" | head -n 1)
          echo "Patching $PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          ruby -e '
            f = "ios/Podfile"
            c = File.read(f)
            patch = <<~RUBY
              post_install do |installer|
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                    config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                    config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  end
                end
            RUBY
            File.write(f, c.sub(/post_install do \|installer\|/, patch))
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Release Archive (arm64)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE | Scheme: $SCHEME"

          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Pershot.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tee xcodebuild.log; then
            echo "================ XCODE ERROR DETAILS ================"
            grep -n -C 5 -E "(error:|fatal error:|Command PhaseScriptExecution failed|ARCHIVE FAILED)" xcodebuild.log | tail -n 50
            exit 1
          fi

      - name: Package Unsigned .ipa for SibApp
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R Pershot.xcarchive/Products/Applications/*.app Payload/
          zip -qry Pershot-SibApp-1.0.3.ipa Payload
          ls -lh Pershot-SibApp-1.0.3.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pershot-SibApp-IPA
          path: ios/build/Pershot-SibApp-1.0.3.ipa