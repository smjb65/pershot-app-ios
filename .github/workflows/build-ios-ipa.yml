name: Build Unsigned iOS IPA for SibApp

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_BUILD_FROM_SOURCE: '1'
      EXPO_USE_PRECOMPILED_MODULES: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Select Xcode 26+
        run: |
          ruby -e '
            apps = Dir.glob("/Applications/Xcode*.app").sort
            puts "=== Available Xcodes ==="
            puts apps
            xc262 = apps.find { |a| a.include?("Xcode_26.2") }
            chosen = xc262 || apps.select { |a| !a.downcase.include?("beta") && a.match(/Xcode_(2[6-9]|[3-9]\d)/) }.last
            chosen ||= apps.select { |a| a.match(/Xcode_(2[6-9]|[3-9]\d)/) }.last
            abort("No Xcode 26+ found on runner!") unless chosen
            puts "=== Selected Xcode: #{chosen} ==="
            File.write("/tmp/selected_xcode.txt", "#{chosen}/Contents/Developer")
          '
          DEV_DIR=$(cat /tmp/selected_xcode.txt)
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Patch expo-modules-jsi for Xcode 26.2+ (pure Swift 6 ABI)
        run: |
          ruby -e '
            Dir.glob("node_modules/**/expo-modules-jsi/**/RuntimeScheduler.h").each do |f|
              c = File.read(f)
              File.write(f, c.gsub(/SWIFT_RETURNS_RETAINED\s+RuntimeScheduler\(/, "RuntimeScheduler("))
              puts "Patched RuntimeScheduler.h: #{f}"
            end

            Dir.glob("node_modules/**/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Contexts/*.swift").each do |f|
              c = File.read(f)
              patched = c.gsub(/(\bclass\s+\w+[^{]*?)(?<!@unchecked\s)\bSendable\b/, "\\1@unchecked Sendable")
              if patched != c
                File.write(f, patched)
                puts "Patched @unchecked Sendable in: #{f}"
              end
            end

            Dir.glob("node_modules/**/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptPromise.swift").each do |f|
              c = File.read(f)
              patched = c.gsub("private let longLivedState = LongLivedState()", "private let longLivedState = JavaScriptActor.assumeIsolated { LongLivedState() }")
              if patched != c
                File.write(f, patched)
                puts "Patched JavaScriptPromise.swift: #{f}"
              end
            end

            Dir.glob("node_modules/**/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift").each do |f|
              lines = File.readlines(f)
              out = []
              patched_count = 0

              lines.each_with_index do |line, idx|
                if line.include?("JavaScriptActor.assumeIsolated") || line.include?("JavaScriptActor.runIsolated")
                  depth = 0
                  started = false
                  body_lines = []
                  k = idx
                  while k < lines.length
                    l = lines[k]
                    body_lines << l
                    l.each_char do |ch|
                      if ch == "{"
                        depth += 1
                        started = true
                      elsif ch == "}"
                        depth -= 1
                      end
                    end
                    break if started && depth <= 0
                    k += 1
                  end

                  body = body_lines.join
                  ptrs = body.scan(/\b([a-z][a-zA-Z0-9_]*Ptr)\b/).flatten.uniq
                  declared = body.scan(/\b(?:let|var)\s+([a-z][a-zA-Z0-9_]*Ptr)\b/).flatten.uniq
                  ptrs -= declared

                  unless ptrs.empty?
                    indent = line[/^\s*/]
                    ptrs.each do |p|
                      out << "#{indent}nonisolated(unsafe) let #{p} = #{p}\n"
                    end
                    patched_count += 1
                  end
                end
                out << line
              end

              File.write(f, out.join)
              puts "Total patched JavaScriptActor blocks in #{f}: #{patched_count}"
            end
          '

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Node binary, build from source, and disable code signing
        run: |
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

          PBXPROJ=$(find ios -name "project.pbxproj" | head -n 1)
          echo "Patching $PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          ruby -rjson << 'RUBY_SCRIPT'
            props_file = "ios/Podfile.properties.json"
            props = File.exist?(props_file) ? JSON.parse(File.read(props_file)) : {}
            props["expo.usePrecompiledModules"] = "false"
            props["ios.buildFromSource"] = "true"
            File.write(props_file, JSON.pretty_generate(props))
            puts "Updated Podfile.properties.json: #{props.inspect}"

            f = "ios/Podfile"
            c = File.read(f)
            patch = <<~'PODFILE_PATCH'
              post_install do |installer|
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                    config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                    config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                    config.build_settings["SWIFT_VERSION"] = "5.0"
                    config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
                    if config.build_settings["OTHER_SWIFT_FLAGS"].is_a?(Array)
                      config.build_settings["OTHER_SWIFT_FLAGS"] = config.build_settings["OTHER_SWIFT_FLAGS"].map { |fl| fl.to_s.gsub("-swift-version 6", "-swift-version 5") }
                    elsif config.build_settings["OTHER_SWIFT_FLAGS"].is_a?(String)
                      config.build_settings["OTHER_SWIFT_FLAGS"] = config.build_settings["OTHER_SWIFT_FLAGS"].gsub("-swift-version 6", "-swift-version 5")
                    end
                  end
                end

                jsi_target = installer.pods_project.targets.find { |t| t.name == "ExpoModulesJSI" }
                if jsi_target
                  phases = jsi_target.shell_script_build_phases
                  puts "=== ExpoModulesJSI script phases: #{phases.map(&:name).inspect} ==="
                  build_phase = phases.find { |p| p.name.to_s.include?("Build ExpoModulesJSI") }
                  copy_phase = phases.find { |p| p.name.to_s.include?("Copy XCFrameworks") }
                  if build_phase && copy_phase
                    copy_phase.shell_script = "set -e\n(\n#{build_phase.shell_script}\n)\n#{copy_phase.shell_script}"
                    copy_phase.input_paths = []
                    copy_phase.input_file_list_paths = []
                    copy_phase.always_out_of_date = "1" if copy_phase.respond_to?(:always_out_of_date=)
                    jsi_target.build_phases.delete(build_phase)
                    puts "✅ Merged Build ExpoModulesJSI into Copy XCFrameworks (strict sequential order)"
                  end
                end
            PODFILE_PATCH
            File.write(f, c.sub(/post_install do \|installer\|/) { patch })
          RUBY_SCRIPT

      - name: Install CocoaPods
        run: |
          cd ios
          for i in 1 2 3; do
            pod install --repo-update && break
            echo "pod install failed (attempt $i), retrying in 10s..."
            sleep 10
          done

      - name: Build Unsigned Release Archive (arm64)
        run: |
          set -o pipefail
          echo "=== Removing any stale prebuilt ExpoModulesJSI.xcframework before archive ==="
          find node_modules -path "*/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework" -type d -prune -exec rm -rf {} + 2>/dev/null || true

          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE | Scheme: $SCHEME"

          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Pershot.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tee xcodebuild.log; then
            echo "================ XCODE ERROR DETAILS ================"
            grep -n -C 5 -E "(error:|fatal error:|Command PhaseScriptExecution failed|ARCHIVE FAILED)" xcodebuild.log | tail -n 50
            exit 1
          fi

      - name: Verify ExpoModulesJSI symbols (prevent DYLD crash)
        run: |
          APP_DIR=$(find ios/build/Pershot.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          JSI_BIN="$APP_DIR/Frameworks/ExpoModulesJSI.framework/ExpoModulesJSI"

          if [ ! -f "$JSI_BIN" ]; then
            echo "ℹ️ ExpoModulesJSI is statically linked (no dynamic framework to mismatch)."
            exit 0
          fi

          APP_DIR="$APP_DIR" JSI_BIN="$JSI_BIN" python3 - << 'PY'
          import os, re, subprocess, sys

          app_dir = os.environ["APP_DIR"]
          jsi_bin = os.environ["JSI_BIN"]

          def run(cmd):
              return subprocess.check_output(cmd, text=True, errors="replace")

          exports_out = run(["xcrun", "dyld_info", "-exports", jsi_bin])
          exports = set(re.findall(r"(?<!\S)(_[A-Za-z0-9_$]+)", exports_out))
          print(f"Exported symbols in ExpoModulesJSI: {len(exports)}")

          targets = [os.path.join(app_dir, "Pershot")]
          fw_root = os.path.join(app_dir, "Frameworks")
          if os.path.isdir(fw_root):
              for fw in sorted(os.listdir(fw_root)):
                  if fw.endswith(".framework"):
                      name = fw[:-len(".framework")]
                      p = os.path.join(fw_root, fw, name)
                      if os.path.isfile(p) and os.path.realpath(p) != os.path.realpath(jsi_bin):
                          targets.append(p)

          missing_any = False
          for t in targets:
              if not os.path.isfile(t):
                  continue
              imp_out = run(["xcrun", "dyld_info", "-imports", t])
              imports = set()
              for line in imp_out.splitlines():
                  if "ExpoModulesJSI" in line:
                      m = re.findall(r"(?<!\S)(_[A-Za-z0-9_$]+)", line)
                      if m:
                          imports.add(m[-1])
              missing = sorted(imports - exports)
              print(f"Checked {os.path.basename(t)}: {len(imports)} ExpoModulesJSI imports, {len(missing)} missing")
              if missing:
                  missing_any = True
                  print(f"❌ MISSING SYMBOLS required by {os.path.basename(t)}:")
                  for s in missing:
                      print("  ", s)

          if missing_any:
              sys.exit(1)
          print("✅ 100% of ExpoModulesJSI runtime imports are exported by ExpoModulesJSI.framework!")
          PY

      - name: Package Unsigned .ipa for SibApp
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R Pershot.xcarchive/Products/Applications/*.app Payload/
          zip -qry Pershot-SibApp-1.0.4.ipa Payload
          ls -lh Pershot-SibApp-1.0.4.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pershot-SibApp-IPA
          path: ios/build/Pershot-SibApp-1.0.4.ipa
