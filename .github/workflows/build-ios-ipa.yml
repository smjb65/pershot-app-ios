name: Build Unsigned iOS IPA for SibApp

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Select Xcode with Swift 6.2 (best match for Expo SDK 57)
        run: |
          ruby -e '
            apps = Dir.glob("/Applications/Xcode*.app").sort
            puts "=== Available Xcodes ==="
            info = apps.map do |app|
              swift_bin = "#{app}/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
              ver_out = File.exist?(swift_bin) ? `#{swift_bin} --version 2>&1` : ""
              m = ver_out.match(/Swift version (\d+\.\d+(?:\.\d+)?)/)
              sver = m ? m[1] : "0.0"
              puts "  #{app} -> Swift #{sver}"
              { app: app, swift: sver, is_beta: app.downcase.include?("beta") }
            end

            # اولویت اول: Xcode با Swift 6.2.x (کاملاً سازگار با Expo SDK 57)
            chosen = info.select { |x| x[:swift].start_with?("6.2") && !x[:is_beta] }.last
            chosen ||= info.select { |x| x[:swift].start_with?("6.2") }.last
            # اولویت دوم: جدیدترین نسخه Swift >= 6.2
            chosen ||= info.select { |x| Gem::Version.new(x[:swift]) >= Gem::Version.new("6.2") && !x[:is_beta] }.last
            chosen ||= info.select { |x| Gem::Version.new(x[:swift]) >= Gem::Version.new("6.2") }.last

            abort("No Xcode with Swift 6.2+ found!") unless chosen
            puts "=== Selected: #{chosen[:app]} (Swift #{chosen[:swift]}) ==="
            File.write("/tmp/selected_xcode.txt", "#{chosen[:app]}/Contents/Developer")
            File.write("/tmp/selected_swift.txt", chosen[:swift])
          '
          DEV_DIR=$(cat /tmp/selected_xcode.txt)
          SWIFT_VER=$(cat /tmp/selected_swift.txt)
          sudo xcode-select -s "$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          echo "SELECTED_SWIFT_VER=$SWIFT_VER" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch expo-modules-jsi only if Swift >= 6.3
        run: |
          ruby -e '
            sver = ENV["SELECTED_SWIFT_VER"] || "0.0"
            if Gem::Version.new(sver) >= Gem::Version.new("6.3")
              puts "Swift #{sver} detected -> applying Xcode 26.3 compatibility patches..."

              Dir.glob("node_modules/**/expo-modules-jsi/**/RuntimeScheduler.h").each do |f|
                c = File.read(f)
                File.write(f, c.gsub(/SWIFT_RETURNS_RETAINED\s+RuntimeScheduler\(/, "RuntimeScheduler("))
                puts "Patched #{f}"
              end

              Dir.glob("node_modules/**/expo-modules-jsi/apple/Package.swift").each do |f|
                c = File.read(f)
                c = c.gsub(/\.swiftLanguageMode\(\.v6\)/, ".swiftLanguageMode(.v5)")
                c = c.gsub(/swiftLanguageModes:\s*\[\s*\.v6\s*\]/, "swiftLanguageModes: [.v5]")
                unless c.include?("swiftLanguageModes")
                  c << "\npackage.swiftLanguageModes = [.v5]\n"
                end
                File.write(f, c)
                puts "Patched #{f}"
              end
            else
              puts "Swift #{sver} detected -> native Expo SDK 57 support, no patch needed."
            end
          '

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Node binary and disable code signing
        run: |
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

          PBXPROJ=$(find ios -name "project.pbxproj" | head -n 1)
          echo "Patching $PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          ruby -e '
            f = "ios/Podfile"
            c = File.read(f)
            patch = <<~RUBY
              post_install do |installer|
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                    config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                    config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  end
                end
            RUBY
            File.write(f, c.sub(/post_install do \|installer\|/, patch))
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Release Archive (arm64)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE | Scheme: $SCHEME"

          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Pershot.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tee xcodebuild.log; then
            echo "================ XCODE ERROR DETAILS ================"
            grep -n -C 5 -E "(error:|fatal error:|Command PhaseScriptExecution failed|ARCHIVE FAILED)" xcodebuild.log | tail -n 50
            exit 1
          fi

      - name: Package Unsigned .ipa for SibApp
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R Pershot.xcarchive/Products/Applications/*.app Payload/
          zip -qry Pershot-SibApp-1.0.3.ipa Payload
          ls -lh Pershot-SibApp-1.0.3.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pershot-SibApp-IPA
          path: ios/build/Pershot-SibApp-1.0.3.ipa